spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/ticketing
    username: ${DB_USERNAME:ticketing}
    password: ${DB_PASSWORD:secret}
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        generate_statistics: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: 5672
    username: ${RABBIT_USER:guest}
    password: ${RABBIT_PASSWORD:guest}